name: Find avatar candidates (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f avatar-candidates/picks.json ]; then python3 scripts/avatar-fetch.py; else python3 scripts/avatar-candidates.py; fi
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatar-candidates
          git commit -m "Avatar candidates from Wikimedia Commons" || exit 0
          git push
