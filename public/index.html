<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scream Queue</title>
  <meta name="description" content="Find the horror movie to watch next: trending vs. widely seen, sorted by subgenre and your streaming services.">
  <meta name="theme-color" content="#0f1013">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/logo-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#/"><span class="mark" id="mark"></span><span id="brand">Scream Queue</span><span class="beta" title="Still being built. Use Send feedback to report problems.">Beta</span></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="notes" id="banner" hidden></div>
  <main class="wrap" id="main"><div class="empty">Loading the shelves…</div></main>
  <footer>
    <div class="wrap">
      <span class="foot-links"><a href="#/about">How it works</a><a href="#/privacy">Privacy</a><a href="#/contact" data-act="contact">Contact</a></span>
      <span>Movie data from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming availability from JustWatch.</span>
      <span id="version"></span>
    </div>
  </footer>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <dialog class="detail" id="detail" aria-label="Movie details"></dialog>
  <dialog class="player" id="player" aria-label="Trailer"></dialog>
  <dialog class="formdlg" id="formdlg"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
