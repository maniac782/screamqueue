<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scream Queue</title>
  <meta name="description" content="Find the horror movie to watch next: trending vs. widely seen, sorted by subgenre and your streaming services.">
  <meta name="theme-color" content="#20151c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#/" id="brand">Scream Queue</a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="wrap" id="main"><div class="empty">Loading the shelves…</div></main>
  <footer>
    <div class="wrap">
      <div class="row" style="justify-content:space-between"><span><a href="#/about">How it works</a></span><span class="mono" id="version"></span></div>
      <span>Movie data from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming availability from JustWatch.</span>
    </div>
  </footer>
  <dialog class="detail" id="detail" aria-label="Movie details"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
